---
name: Configure maintenance Pull Request
permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    types:
      - labeled
      - opened

jobs:
  configure-pr:
    name: Configure maintenance Pull Request
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write # OIDC for the Vault JWT login
    steps:
      - name: Generate a GitHub token
        id: github-token
        uses: camunda/infra-global-github-actions/generate-github-app-token-from-vault-secrets@67d00e9260887361a31f6446252fffbecae4a02e # generate-github-app-token-from-vault-secrets-1.1.1
        with:
          github-app-id-vault-key: GITHUB_APP_ID
          github-app-id-vault-path: secret/data/products/infra/ci/team-infrastructure
          github-app-private-key-vault-key: GITHUB_APP_PRIVATE_KEY
          github-app-private-key-vault-path: secret/data/products/infra/ci/team-infrastructure
          vault-auth-method: jwt
          vault-auth-jwt-path: ${{ secrets.VAULT_JWT_PATH }}
          vault-auth-jwt-role: ${{ secrets.VAULT_JWT_ROLE }}
          vault-auth-jwt-audience: ${{ secrets.VAULT_JWT_AUDIENCE }}
          vault-url: ${{ secrets.VAULT_ADDR }}

      - name: Import Secrets
        id: secrets
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: jwt
          role: ${{ secrets.VAULT_JWT_ROLE }}
          path: ${{ secrets.VAULT_JWT_PATH }}
          jwtGithubAudience: ${{ secrets.VAULT_JWT_AUDIENCE }}
          exportEnv: false # we rely on step outputs, no need for environment variables
          secrets: |
            secret/data/products/infra/ci/infra-core SLACK_WEBHOOK_INFRA_ALERTS;

      - name: Apply maintenance parameters to the Pull Request if applicable
        uses: camunda/infra-global-github-actions/teams/infra/configure-maintenance-pull-request@67d00e9260887361a31f6446252fffbecae4a02e # configure-maintenance-pull-request-1.0.1
        with:
          github-token: ${{ steps.github-token.outputs.token }}
          slack-webhook-url: ${{ steps.secrets.outputs.SLACK_WEBHOOK_INFRA_ALERTS }}
