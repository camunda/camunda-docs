name: publish-prod

on:
  push:
    tags:
      - "8.7.[0-9]+"

permissions:
  id-token: write

jobs:
  publish:
    runs-on: gcp-core-16-release
    container: node:24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install Dependencies
        run: npm ci
      - name: Enable Indexing
        run: "sed -i 's/noIndex: true/noIndex: false/g' docusaurus.config.js"
      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: --max_old_space_size=8192
          DOCS_SITE_URL: https://unsupported.docs.camunda.io
          DOCS_SITE_BASE_URL: /8.7/
      - name: Import Secrets
        id: secrets
        uses: hashicorp/vault-action@79632e33d6953d190b940ffa440bf97821cabd80
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          exportEnv: false
          secrets: |
            secret/data/products/camunda-docs/ci/publish PROD_UNSUPPORTED_PATH;
            secret/data/products/camunda-docs/ci/publish HOST;
            secret/data/products/camunda-docs/ci/publish USER;
            secret/data/products/camunda-docs/ci/publish PRIVATE_KEY;
      - name: Publish
        timeout-minutes: 30
        uses: burnett01/rsync-deployments@155b6d6c1219ab2224c20c58d423a3f1b850395f # 9.0.1
        with:
          switches: -avzr --delete --timeout=300
          path: build/
          remote_path: ${{ steps.secrets.outputs.PROD_UNSUPPORTED_PATH }}/8.7
          remote_host: ${{ steps.secrets.outputs.HOST }}
          remote_user: ${{ steps.secrets.outputs.USER }}
          remote_key: ${{ steps.secrets.outputs.PRIVATE_KEY }}
  notify-failure:
    needs:
      - publish
    if: failure() || (success() && fromJSON(github.run_attempt) > 1)
    uses: ./.github/workflows/notify-failure.yml
    with:
      # If any dependent job fails, set the dependency_status to 'failure',
      # otherwise set it to 'success'.
      dependency_status: ${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}
    secrets:
      VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
      VAULT_ROLE_ID: ${{ secrets.VAULT_ROLE_ID }}
      VAULT_SECRET_ID: ${{ secrets.VAULT_SECRET_ID }}
