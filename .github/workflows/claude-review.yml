name: Claude PR Review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude-review-secrets:
    name: Wrap Claude review secrets
    if: |
      (github.event_name == 'pull_request_review_comment' &&
       contains(github.event.comment.body, '@claude') &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '@claude') &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for the Vault JWT login
    outputs:
      wrap-token: ${{ steps.wrap.outputs.wrap-token }}
    steps:
      - name: Wrap secrets for the review job
        id: wrap
        uses: camunda/infra-global-github-actions/vault-wrapped-secrets/wrap@c21e31eece771eb13d6c5e08e8831c9de62888bd # vault-wrapped-secrets-1.0.0
        with:
          vault-url: ${{ secrets.VAULT_ADDR }}
          vault-auth-jwt-path: ${{ secrets.VAULT_JWT_PATH }}
          vault-auth-jwt-role: ${{ secrets.VAULT_JWT_ROLE }}
          vault-auth-jwt-audience: ${{ secrets.VAULT_JWT_AUDIENCE }}
          secrets: |
            secret/data/products/camunda-docs/ci/claude-reviewer ANTHROPIC_API_KEY | ANTHROPIC_API_KEY;

  claude-review:
    needs: claude-review-secrets
    if: |
      (github.event_name == 'pull_request_review_comment' &&
       contains(github.event.comment.body, '@claude') &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '@claude') &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Unwrap secrets
        id: unwrap
        uses: camunda/infra-global-github-actions/vault-wrapped-secrets/unwrap@c21e31eece771eb13d6c5e08e8831c9de62888bd # vault-wrapped-secrets-1.0.0
        with:
          vault-url: ${{ secrets.VAULT_ADDR }}
          wrap-token: ${{ needs.claude-review-secrets.outputs.wrap-token }}

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Claude review
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        with:
          anthropic_api_key: ${{ fromJSON(steps.unwrap.outputs.secrets).ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            A commenter left this message on this pull request:

            "${{ github.event.comment.body }}"

            If the message is just the "@claude" mention on its own, or a generic ask like "review this" or "please review", perform a full review of this pull request against the Camunda docs contribution standards referenced from AGENTS.md. Post inline review comments on the specific lines where issues are found. For each issue, include a concrete fix using GitHub's suggestion block format so the author can apply it directly:

            ```suggestion
            <replacement text here>
            ```

            Use suggestion blocks whenever a fix can be expressed as a direct text replacement on the commented line(s).

            Otherwise, address the specific request directly instead of doing a general review. Depending on what is being asked, this may mean:
            - Answering a question about the code or documentation in a reply comment.
            - Making the requested changes and pushing them as a new commit to this PR's branch.
            - Opening a new pull request if the request is out of scope for this PR.

            Follow the Camunda docs contribution standards referenced from AGENTS.md for any content changes.
