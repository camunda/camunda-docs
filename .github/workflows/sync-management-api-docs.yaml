name: Sync Camunda cluster management API

on:
  schedule:
    - cron: "30 15 * * 4" # Runs every Thursday at 3:30 PM UTC
  workflow_dispatch:

jobs:
  sync-file:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Camunda docs repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: camunda/camunda-docs
          path: docs

      - name: Import Secrets
        id: secrets
        uses: hashicorp/vault-action@79632e33d6953d190b940ffa440bf97821cabd80
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          exportEnv: false
          secrets: |
            secret/data/products/camunda-docs/github/apps/camunda-docs-pr-automation APP_ID;
            secret/data/products/camunda-docs/github/apps/camunda-docs-pr-automation APP_PRIVATE_KEY;

      - name: Check for stable branch
        id: compute_branch
        run: |
          # During development of a minor release, engineers push changes to the camunda repo's main branch, so we use main during this time to keep the docs up to date 
          # with the alpha releases. However, toward the end of the dev cycle for the minor version, engineers cut a stable version branch in the form stable/8.x and 
          # start including code for the next version in main. At this point, we need to stop using main and switch to the stable branch until the minor version ships. 
          # After that, we need to switch back to using main.

          # This step in the workflow uses the docs repo's latest release tag to compute the next expected stable branch. If such a branch exists, we use it.
          # Otherwise, we use main.

          # Get the latest docs tag, and increment the minor version to store the next minor release.
          cd docs
          next_minor_release=$(
            git ls-remote --tags origin '*.*.*'  \
                | awk '{print $2}' \
                | sed 's#refs/tags/##' \
                | sort -V \
                | tail -n1 \
                | awk -F. '{printf "%d.%d", $1, $2+1}'
          )

          # If a stable camunda branch exists for the next minor release, use it. Otherwise, use main.
          stable_branch="stable/$next_minor_release"
          if git ls-remote --exit-code --heads https://github.com/camunda/camunda $stable_branch; then
            echo "Found a stable branch: $stable_branch"
            echo "camunda_branch=$stable_branch" >> "$GITHUB_OUTPUT"
          else
            echo "No stable branch for version $next_minor_release, using main"
            echo "camunda_branch=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Camunda
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: camunda/camunda
          path: mgmt-spec
          ref: ${{ steps.compute_branch.outputs.camunda_branch }}
          sparse-checkout: dist/src/main/resources/api
          sparse-checkout-cone-mode: false

      - name: Sync cluster management API specs
        run: |
          cd docs
          spec_dir=../mgmt-spec/dist/src/main/resources/api
          cp "$spec_dir"/cluster/*.yaml api/cluster/
          cp "$spec_dir"/backup-management-api.yaml api/cluster/
          npm i
          npm run api:generate:cluster

      - name: Check for changes
        id: check_changes
        run: |
          cd docs

          # We run lint-staged as a pre-commit hook. One of the format changes it performs
          # is to remove whitespace-only changes. Therefore, if the REST API spec changes only
          # include whitespace changes, lint-staged removes them and results in an error:
          # "[FAILED] Prevented an empty git commit!"
          # 
          # To mitigate this, we stage the changes _before_ we check if there are any.
          # Then, we run lint-staged manually. Finally, we check if there are changes.
          # This should get rid of the whitespace-only changes and avoid an empty commit.
          git add .
          npx lint-staged --allow-empty

          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes detected."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate token
        if: steps.check_changes.outputs.has_changes == 'true'
        id: generate_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ steps.secrets.outputs.APP_ID }}
          private-key: ${{ steps.secrets.outputs.APP_PRIVATE_KEY }}

      - name: Create Pull Request
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: "${{ steps.generate_token.outputs.token }}"
          path: docs
          title: Update cluster management API doc
          body: |
            ## Description

            This is an autogenerated PR by the [sync management api specs workflow](https://github.com/camunda/camunda-docs/tree/main/.github/workflows/sync-management-api-docs.yaml).
            This PR contains every change made to the cluster management API specs in the [monorepo](https://github.com/camunda/camunda/tree/main/dist/src/main/resources/api) in the last week, plus the generated OpenAPI files related to the changes.

            ## When should this change go live?

            - There is **no urgency** with this change and can be released at any time.

            ## PR Checklist

            - My changes are for the **next minor** and are in `/docs` directory (aka `/next/`).
            - My changes require a [technical writer review](https://github.com/camunda/camunda-docs/blob/main/howtos/documentation-guidelines.md#review-process), and I've assigned @camunda/tech-writers as a reviewer.

          commit-message: "docs: update cluster management API spec"
          branch: update-management-api-doc
          delete-branch: true
          team-reviewers: camunda/tech-writers
          base: main
          labels: deploy
  notify-failure:
    needs:
      - sync-file
    if: failure() || (success() && fromJSON(github.run_attempt) > 1)
    uses: ./.github/workflows/notify-failure.yml
    with:
      # If any dependent job fails, set the dependency_status to 'failure',
      # otherwise set it to 'success'.
      dependency_status: ${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}
    secrets:
      VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
      VAULT_ROLE_ID: ${{ secrets.VAULT_ROLE_ID }}
      VAULT_SECRET_ID: ${{ secrets.VAULT_SECRET_ID }}
