# camunda/smx#232: Notify only for PRs labeled for InfraEx or Self-Managed.
name: Urgent review notification

on:
  pull_request_target:
    types: [labeled]

permissions: {}

jobs:
  notify:
    if: contains(github.event.pull_request.labels.*.name, 'component:infraex') || contains(github.event.pull_request.labels.*.name, 'component:self-managed')
    permissions:
      id-token: write
    uses: camunda/infraex-common-config/.github/workflows/notify-urgent-review-global.yml@878e9c01c4ba93d4bb162d399ab35266fe11f5a3 # feat/notify-review-on-slack
    secrets: inherit
