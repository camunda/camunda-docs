name: publish-stage

on:
  push:
    branches:
      - "main"
    tags-ignore:
      - "*"

permissions:
  id-token: write

jobs:
  publish:
    runs-on: gcp-core-8-default
    container: node:24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install Dependencies
        run: npm ci
      - name: Cache Docusaurus
        uses: ./.github/actions/docusaurus-cache
      - name: Update redirects for environment
        run: "sed -i 's!https://unsupported.docs.camunda.io!https://stage.unsupported.docs.camunda.io!g' ./static/.htaccess"
      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: --max_old_space_size=8192
          DOCS_SITE_URL: https://stage.docs.camunda.io
          DOCS_SITE_BASE_URL: /
      - name: Import Secrets
        id: secrets
        uses: hashicorp/vault-action@79632e33d6953d190b940ffa440bf97821cabd80
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          exportEnv: false
          secrets: |
            secret/data/products/camunda-docs/ci/publish STAGE_PATH;
            secret/data/products/camunda-docs/ci/publish HOST;
            secret/data/products/camunda-docs/ci/publish USER;
            secret/data/products/camunda-docs/ci/publish PRIVATE_KEY;
      - name: Install rsync
        timeout-minutes: 3
        run: apt-get update && apt-get install -y --no-install-recommends rsync openssh-client
      - name: Publish
        timeout-minutes: 30
        env:
          REMOTE_PATH: ${{ steps.secrets.outputs.STAGE_PATH }}
          REMOTE_HOST: ${{ steps.secrets.outputs.HOST }}
          REMOTE_USER: ${{ steps.secrets.outputs.USER }}
          REMOTE_KEY: ${{ steps.secrets.outputs.PRIVATE_KEY }}
        shell: bash # arrays below require bash
        run: |
          # Write the private key to a file, since ssh can't read a key from a string.
          key="$RUNNER_TEMP/deploy_key"
          install -m 600 /dev/null "$key"
          printf '%s\n' "$REMOTE_KEY" > "$key"
          trap 'rm -f "$key"' EXIT

          ssh_opts=(
            -i "$key"                        # Authenticate with this key file.
            -o IdentitiesOnly=yes            # Offer only that key; don't try any other identities.
            -o StrictHostKeyChecking=no      # Don't prompt or fail on unknown host keys (same as the old action's default).
            -o UserKnownHostsFile=/dev/null  # Don't record host keys anywhere.
          )

          rsync_opts=(
            -a                       # Archive mode: recurse, keep permissions, times, symlinks, etc.
            -v                       # Verbose: list each file transferred.
            -z                       # Compress data in transit.
            -r                       # Recurse into directories (already implied by -a; kept to match the old switches).
            --delete                 # Delete remote files that no longer exist in build/.
            --timeout=300            # Abort if no data moves for 300 seconds, so a stalled connection fails instead of hanging.
            -e "ssh ${ssh_opts[*]}"  # Use ssh as the remote shell, with the options above.
          )

          # Perform the actual file synchronization using rsync with the options defined above.
          rsync "${rsync_opts[@]}" build/ "$REMOTE_USER@$REMOTE_HOST:$REMOTE_PATH"
  # Temporarily publish to the old server and new server in parallel. Once we're satisfied everything is working properly,
  # we can remove the old server deployment job.
  publish-aws:
    runs-on: gcp-core-8-default
    container: node:24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install Dependencies
        run: npm ci
      - name: Cache Docusaurus
        uses: ./.github/actions/docusaurus-cache
      - name: Update redirects for environment
        run: "sed -i 's!https://unsupported.docs.camunda.io!https://stage.unsupported.docs.camunda.io!g' ./static/.htaccess"
      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: --max_old_space_size=8192
          DOCS_SITE_URL: https://stage.docs.camunda.io
          DOCS_SITE_BASE_URL: /
      - name: Import Secrets
        id: secrets
        uses: hashicorp/vault-action@79632e33d6953d190b940ffa440bf97821cabd80
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          exportEnv: false
          secrets: |
            secret/data/products/camunda-docs/ci/publish-aws STAGE_PATH;
            secret/data/products/camunda-docs/ci/publish-aws HOST;
            secret/data/products/camunda-docs/ci/publish-aws USER;
            secret/data/products/camunda-docs/ci/publish-aws PRIVATE_KEY;
      - name: Install rsync
        timeout-minutes: 3
        run: apt-get update && apt-get install -y --no-install-recommends rsync openssh-client
      - name: Publish to AWS (stage)
        timeout-minutes: 30
        env:
          REMOTE_PATH: ${{ steps.secrets.outputs.STAGE_PATH }}
          REMOTE_HOST: ${{ steps.secrets.outputs.HOST }}
          REMOTE_USER: ${{ steps.secrets.outputs.USER }}
          REMOTE_KEY: ${{ steps.secrets.outputs.PRIVATE_KEY }}
        shell: bash # arrays below require bash
        run: |
          # Write the private key to a file, since ssh can't read a key from a string.
          key="$RUNNER_TEMP/deploy_key"
          install -m 600 /dev/null "$key"
          printf '%s\n' "$REMOTE_KEY" > "$key"
          trap 'rm -f "$key"' EXIT

          ssh_opts=(
            -i "$key"                        # Authenticate with this key file.
            -o IdentitiesOnly=yes            # Offer only that key; don't try any other identities.
            -o StrictHostKeyChecking=no      # Don't prompt or fail on unknown host keys (same as the old action's default).
            -o UserKnownHostsFile=/dev/null  # Don't record host keys anywhere.
          )

          rsync_opts=(
            -a                       # Archive mode: recurse, keep permissions, times, symlinks, etc.
            -v                       # Verbose: list each file transferred.
            -z                       # Compress data in transit.
            -r                       # Recurse into directories (already implied by -a; kept to match the old switches).
            --delete                 # Delete remote files that no longer exist in build/.
            --timeout=300            # Abort if no data moves for 300 seconds, so a stalled connection fails instead of hanging.
            -e "ssh ${ssh_opts[*]}"  # Use ssh as the remote shell, with the options above.
          )

          # Perform the actual file synchronization using rsync with the options defined above.
          rsync "${rsync_opts[@]}" build/ "$REMOTE_USER@$REMOTE_HOST:$REMOTE_PATH"
  retry-shutdowns:
    # Because we run these jobs on preemptible runners, they can be shut down
    # automatically at any time. Instead of requiring a manual rerun every time
    # this happens, use the reusable action developed by the infra team to retry.
    runs-on: ubuntu-latest
    needs:
      - publish
      - publish-aws
    if: failure() && fromJSON(github.run_attempt) < 3
    steps:
      - name: Retry job
        uses: camunda/infra-global-github-actions/rerun-failed-run@475528365f4010480dccff71ccac554cc3352e7c # rerun-failed-run-1.1.2
        with:
          error-messages: |
            The runner has received a shutdown signal.
            The operation was canceled.
            some files vanished before they could be transferred
            rsync error: timeout in data send/receive
          run-id: ${{ github.run_id }}
          repository: ${{ github.repository }}
          vault-addr: ${{ secrets.VAULT_ADDR }}
          vault-role-id: ${{ secrets.VAULT_ROLE_ID }}
          vault-secret-id: ${{ secrets.VAULT_SECRET_ID }}
  notify-failure:
    needs:
      - publish
      - publish-aws
    if: failure() || (success() && fromJSON(github.run_attempt) > 1)
    uses: ./.github/workflows/notify-failure.yml
    with:
      # If any dependent job fails, set the dependency_status to 'failure',
      # otherwise set it to 'success'.
      dependency_status: ${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}
    secrets:
      VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
      VAULT_ROLE_ID: ${{ secrets.VAULT_ROLE_ID }}
      VAULT_SECRET_ID: ${{ secrets.VAULT_SECRET_ID }}
