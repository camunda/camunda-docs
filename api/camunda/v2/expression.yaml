paths:
  /expression/evaluation:
    post:
      operationId: evaluateExpression
      security:
        - bearerAuth: []
        - basicAuth: []
      tags:
        - Expression
      summary: Evaluate an expression
      description: |-


        [[ADDED_IN_VERSION:8.9]]

        [[REQUIRED_PERMISSIONS:]]

        [[CONSISTENCY:STRONG]]

        Evaluates a FEEL expression and returns the result. Supports references to tenant scoped
        cluster variables when a tenant ID is provided. Optionally, provide a `scopeKey` to make the
        variables of a specific process instance or element instance visible while evaluating the
        expression.

        When the expression references a secret (`camunda.secrets.<name>`), the endpoint never
        returns the resolved secret value. Instead, each reference resolves to its own literal
        placeholder text `camunda.secrets.<name>`, which composes like any other string. This
        changed in 8.10; previously such references evaluated to `null` and logged a warning:

        - `=camunda.secrets.TEST` now returns `"camunda.secrets.TEST"`.
        - `="Bearer " + camunda.secrets.TEST` now returns `"Bearer camunda.secrets.TEST"`.

        Every secret reference the evaluation encountered from a trusted source is listed in the
        `referencedSecrets` array of the response. To obtain the actual secret values, resolve those
        references yourself with [`POST /v2/secrets/resolve`](/apis-tools/orchestration-cluster-api-rest/specifications/resolve-secrets.api.mdx).
        For how the cluster resolves secret references in general, see
        [Secret resolution and job activation](/components/concepts/secret-resolution-and-job-activation.md).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpressionEvaluationRequest"
      responses:
        "200":
          description: Expression evaluated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpressionEvaluationResult"
        "400":
          $ref: "common-responses.yaml#/components/responses/InvalidData"
        "401":
          $ref: "common-responses.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "common-responses.yaml#/components/responses/Forbidden"
        "500":
          $ref: "common-responses.yaml#/components/responses/InternalServerError"
      x-added-in-version: "8.9"
components:
  schemas:
    ExpressionEvaluationRequest:
      type: object
      required:
        - expression
      properties:
        expression:
          type: string
          description: The expression to evaluate (e.g., "=x + y")
          example: "=x + y"
        tenantId:
          type: string
          description: Required when the expression references tenant-scoped cluster variables
          example: tenant_123
        scopeKey:
          allOf:
            - $ref: "keys.yaml#/components/schemas/ScopeKey"
          description: |
            Key of the process instance or element instance whose variables should be made visible
            to the expression. Use a process instance key to evaluate against the process instance
            scope, or an element instance key to evaluate against that element instance scope. If
            omitted, the expression is evaluated unscoped, using only cluster variables
            and request-body variables.
        variables:
          type: object
          description: Optional variables for expression evaluation. These variables are only used for the current evaluation and do not persist beyond it.
          example:
            x: 10
            "y": 20
          additionalProperties: true
          nullable: true
      x-properties-added-in-version:
        - propertyName: scopeKey
          addedInVersion: "8.10"
    ExpressionEvaluationResult:
      type: object
      required:
        - expression
        - result
        - warnings
        - referencedSecrets
      properties:
        expression:
          type: string
          description: The evaluated expression
          example: "=x + y"
        result:
          description: The result value. Its type can vary.
          example: 30
          nullable: true
        warnings:
          type: array
          description: List of warnings generated during expression evaluation
          items:
            $ref: "#/components/schemas/ExpressionEvaluationWarningItem"
          example: []
        referencedSecrets:
          type: array
          description: |
            The secret references resolved from trusted sources while evaluating the expression: a
            `camunda.secrets.<name>` reference used directly in the expression, or a reference
            carried by a `SECRET_REFERENCE`-kind cluster variable the expression read. References
            appearing only in request-body variables or plain cluster variables are excluded.
            Callers use this to know which `camunda.secrets.<name>` occurrences in the result they
            may safely resolve.
          items:
            $ref: "#/components/schemas/ExpressionSecretReferenceItem"
          example: []
      x-properties-added-in-version:
        - propertyName: referencedSecrets
          addedInVersion: "8.10"
    ExpressionSecretReferenceItem:
      type: object
      required:
        - storeId
        - secretName
      properties:
        storeId:
          type: string
          description: The identifier of the secret store that holds the referenced secret
          example: default
        secretName:
          type: string
          description: The secret name, e.g. "token" for "camunda.secrets.token"
          example: token
    ExpressionEvaluationWarningItem:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: The warning message
          example: No function found with name 'random' and 1 parameters
