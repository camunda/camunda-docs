# Folder resource paths and schemas
paths:
  /folders:
    post:
      operationId: createFolder
      summary: Create a folder
      description: Creates a new folder in the specified project and/or parent folder.
      x-added-in-version: "0.1.0"
      x-semantic-provider:
        - folderKey
      tags:
        - Folder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FolderCreateRequest"
      responses:
        "200":
          description: The folder was created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderResult"
        "400":
          $ref: "common-responses.yaml#/components/responses/InvalidData"
        "401":
          $ref: "common-responses.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "common-responses.yaml#/components/responses/Forbidden"
        "500":
          $ref: "common-responses.yaml#/components/responses/InternalServerError"

  /folders/{folderKey}:
    get:
      operationId: getFolder
      summary: Get a folder
      description: Returns the folder metadata and its content (child folders and files).
      x-added-in-version: "0.1.0"
      x-semantic-requires:
        kind: Folder
        bind:
          folderKey:
            from: path
            name: folderKey
      tags:
        - Folder
      parameters:
        - $ref: "#/components/parameters/FolderKeyPathParam"
      responses:
        "200":
          description: The folder was retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderDetailResult"
        "401":
          $ref: "common-responses.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "common-responses.yaml#/components/responses/Forbidden"
        "404":
          $ref: "common-responses.yaml#/components/responses/NotFound"
        "500":
          $ref: "common-responses.yaml#/components/responses/InternalServerError"

    patch:
      operationId: updateFolder
      summary: Update a folder
      description: Updates the name and/or location of an existing folder.
      x-added-in-version: "0.1.0"
      x-semantic-requires:
        kind: Folder
        bind:
          folderKey:
            from: path
            name: folderKey
      tags:
        - Folder
      parameters:
        - $ref: "#/components/parameters/FolderKeyPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FolderUpdateRequest"
      responses:
        "200":
          description: The folder was updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderResult"
        "400":
          $ref: "common-responses.yaml#/components/responses/InvalidData"
        "401":
          $ref: "common-responses.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "common-responses.yaml#/components/responses/Forbidden"
        "404":
          $ref: "common-responses.yaml#/components/responses/NotFound"
        "500":
          $ref: "common-responses.yaml#/components/responses/InternalServerError"

    delete:
      operationId: deleteFolder
      summary: Delete a folder
      description: >-
        Soft-deletes the folder with the given folder key, cascading to all
        of its descendants. The folder is moved to the
        recently deleted state and can be recovered during the retention
        window. To permanently and irreversibly remove a folder, use
        `DELETE /folders/{folderKey}/permanent` instead.
      x-added-in-version: "0.1.0"
      x-semantic-requires:
        kind: Folder
        bind:
          folderKey:
            from: path
            name: folderKey
      tags:
        - Folder
      parameters:
        - $ref: "#/components/parameters/FolderKeyPathParam"
      responses:
        "204":
          description: The folder was deleted successfully.
        "401":
          $ref: "common-responses.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "common-responses.yaml#/components/responses/Forbidden"
        "404":
          $ref: "common-responses.yaml#/components/responses/NotFound"
        "500":
          $ref: "common-responses.yaml#/components/responses/InternalServerError"

  /folders/{folderKey}/permanent:
    delete:
      operationId: permanentlyDeleteFolder
      summary: Permanently delete a folder
      description: >-
        Permanently and irreversibly removes the folder with the given folder
        key. The folder cannot be recovered afterwards. If the folder is
        live (not soft-deleted), then it must not contain any live files
        anywhere in its subtree. Empty live folders are removed as part of
        the deletion as well as any soft-deleted items in its subtree. If the folder is soft-deleted and has been the target of
        the operation, then it is deleted with any soft-deleted folders or
        files it contains. If the folder is soft-deleted but has not been
        the target of the operation (i.e. one of its ancestor
        folders/project/workspace was soft-deleted), then the operation
        fails with 409. Instead, delete the original target of the
        soft-delete operation.
      x-added-in-version: "0.1.0"
      tags:
        - Folder
      parameters:
        - $ref: "#/components/parameters/FolderKeyPathParam"
      responses:
        "204":
          description: The folder was permanently deleted successfully.
        "400":
          $ref: "common-responses.yaml#/components/responses/InvalidData"
        "401":
          $ref: "common-responses.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "common-responses.yaml#/components/responses/Forbidden"
        "404":
          $ref: "common-responses.yaml#/components/responses/NotFound"
        "409":
          description: >-
            The folder is soft-deleted but was not itself the target of the
            soft-delete operation (it was soft-deleted as a descendant of an
            ancestor folder, project, or workspace).
          content:
            application/problem+json:
              schema:
                $ref: "problem-detail.yaml#/components/schemas/ProblemDetail"
        "500":
          $ref: "common-responses.yaml#/components/responses/InternalServerError"

  /folders/recently-deleted/search:
    post:
      operationId: searchRecentlyDeletedFolders
      summary: Search recently deleted folders
      description: >
        Returns soft-deleted folders scoped to the caller's organization. Only
        folders that are the root of their own deletion are listed; a folder
        soft-deleted as part of an ancestor folder, project, or workspace's
        deletion event is represented by that ancestor instead, and a folder
        deleted independently before its ancestor stays listed in its own
        right; use the respective recently-deleted search endpoint to access
        that ancestor entity. Folders remain
        listed until the retention period expires and the scheduled cleanup job
        runs; they can also be restored with
        `POST /folders/{folderKey}/restoration` or permanently removed with
        `DELETE /folders/{folderKey}/permanent`.
      x-added-in-version: "0.4.0"
      tags:
        - Folder
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecentlyDeletedFolderSearchQuery"
      responses:
        "200":
          description: The search completed successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecentlyDeletedFolderSearchQueryResult"
        "400":
          $ref: "common-responses.yaml#/components/responses/InvalidData"
        "401":
          $ref: "common-responses.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "common-responses.yaml#/components/responses/Forbidden"
        "500":
          $ref: "common-responses.yaml#/components/responses/InternalServerError"

  /folders/{folderKey}/restoration:
    post:
      operationId: restoreFolder
      summary: Restore a recently deleted folder
      description: >
        Restores a soft-deleted folder back to the live project, together with
        the descendants that were soft-deleted with it. If the folder's
        original parent folder was also deleted, the folder is restored into a
        new wrapper folder under the nearest surviving ancestor folder, or at
        the project root if no ancestor folder survives. The folder cannot be
        restored while its containing project or workspace is still deleted.
        Only a folder that is the root of its own deletion can be restored via
        this endpoint; a folder that was soft-deleted as part of an ancestor
        folder, project, or workspace's deletion event must be restored
        through the corresponding ancestor restoration endpoint instead.
      x-added-in-version: "0.4.0"
      x-semantic-requires:
        kind: Folder
        bind:
          folderKey:
            from: path
            name: folderKey
      tags:
        - Folder
      parameters:
        - $ref: "#/components/parameters/FolderKeyPathParam"
      responses:
        "200":
          description: The folder was restored successfully. Returns the restored folder.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderResult"
        "401":
          $ref: "common-responses.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "common-responses.yaml#/components/responses/Forbidden"
        "404":
          description: >-
            The recently deleted folder was not found, or is not the root of
            its own deletion.
          content:
            application/problem+json:
              schema:
                $ref: "problem-detail.yaml#/components/schemas/ProblemDetail"
        "409":
          description: >-
            The folder cannot be restored because its containing project or
            workspace is itself deleted. Restore that first.
          content:
            application/problem+json:
              schema:
                $ref: "problem-detail.yaml#/components/schemas/ProblemDetail"
        "500":
          $ref: "common-responses.yaml#/components/responses/InternalServerError"

components:
  parameters:
    FolderKeyPathParam:
      name: folderKey
      in: path
      required: true
      description: The unique key identifying the folder.
      schema:
        $ref: "keys.yaml#/components/schemas/FolderKey"

  schemas:
    # --- Request schemas ---

    FolderCreateRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - projectKey
      example:
        name: "processes"
        projectKey: "28b47b0a-364c-4dbe-9836-41ab371c15b2"
      properties:
        name:
          description: The name of the folder.
          type: string
          minLength: 1
          maxLength: 255
        projectKey:
          description: The key of the project this folder belongs to.
          allOf:
            - $ref: "keys.yaml#/components/schemas/ProjectKey"
        parentFolderKey:
          description: >
            The key of the parent folder. If omitted or null, the folder is created at project root.
          nullable: true
          allOf:
            - $ref: "keys.yaml#/components/schemas/FolderKey"

    FolderUpdateRequest:
      type: object
      additionalProperties: false
      example:
        name: "archived-processes"
        parentFolderKey: "3e98d77b-799b-4f31-bfc4-4c5829fc7dee"
      properties:
        name:
          description: The updated name of the folder.
          type: string
          minLength: 1
          maxLength: 255
        projectKey:
          description: The project to move the folder to.
          allOf:
            - $ref: "keys.yaml#/components/schemas/ProjectKey"
        parentFolderKey:
          description: >
            The updated parent folder key. Set to null to move to project root.
            Cannot be the same as the folder being updated.
          nullable: true
          allOf:
            - $ref: "keys.yaml#/components/schemas/FolderKey"

    # --- Response schemas ---

    FolderResult:
      type: object
      example:
        folderKey: "bccb5014-10a7-48df-bb56-81cb286594cc"
        name: "processes"
        projectKey: "28b47b0a-364c-4dbe-9836-41ab371c15b2"
        parentFolderKey: "3e98d77b-799b-4f31-bfc4-4c5829fc7dee"
        created: "2025-03-15T10:30:00.000Z"
        createdBy:
          name: "Jane Doe"
          email: "jane.doe@example.com"
        updated: "2025-06-10T14:22:00.000Z"
        updatedBy:
          name: "Jane Doe"
          email: "jane.doe@example.com"
      required:
        - folderKey
        - name
        - projectKey
        - parentFolderKey
        - created
        - createdBy
        - updated
        - updatedBy
      properties:
        folderKey:
          description: The unique key identifying this folder.
          allOf:
            - $ref: "keys.yaml#/components/schemas/FolderKey"
        name:
          description: The name of the folder.
          type: string
        projectKey:
          description: The key of the project this folder belongs to.
          allOf:
            - $ref: "keys.yaml#/components/schemas/ProjectKey"
        parentFolderKey:
          description: The key of the parent folder. Null if the folder is at project root.
          nullable: true
          allOf:
            - $ref: "keys.yaml#/components/schemas/FolderKey"
        created:
          description: The timestamp when the folder was created.
          type: string
          format: date-time
        createdBy:
          description: The user who created the folder.
          allOf:
            - $ref: "files.yaml#/components/schemas/UserReference"
        updated:
          description: The timestamp when the folder was last updated.
          type: string
          format: date-time
        updatedBy:
          description: The user who last updated the folder.
          allOf:
            - $ref: "files.yaml#/components/schemas/UserReference"

    FolderDetailResult:
      type: object
      description: A folder with its metadata and content (child folders and files).
      example:
        folder:
          folderKey: "bccb5014-10a7-48df-bb56-81cb286594cc"
          name: "processes"
          projectKey: "28b47b0a-364c-4dbe-9836-41ab371c15b2"
          parentFolderKey: "3e98d77b-799b-4f31-bfc4-4c5829fc7dee"
          created: "2025-03-15T10:30:00.000Z"
          createdBy:
            name: "Jane Doe"
            email: "jane.doe@example.com"
          updated: "2025-06-10T14:22:00.000Z"
          updatedBy:
            name: "Jane Doe"
            email: "jane.doe@example.com"
        content:
          folders:
            - folderKey: "eee21adc-05ff-4e2f-b0b4-08864dceae21"
              name: "sub-processes"
              projectKey: "28b47b0a-364c-4dbe-9836-41ab371c15b2"
              parentFolderKey: "bccb5014-10a7-48df-bb56-81cb286594cc"
              created: "2025-04-01T08:00:00.000Z"
              createdBy:
                name: "Jane Doe"
                email: "jane.doe@example.com"
              updated: "2025-04-01T08:00:00.000Z"
              updatedBy:
                name: "Jane Doe"
                email: "jane.doe@example.com"
          files:
            - fileKey: "c53a4d9d-b997-4633-a681-d28149e9dae1"
              name: "order-process"
              projectKey: "28b47b0a-364c-4dbe-9836-41ab371c15b2"
              folderKey: "bccb5014-10a7-48df-bb56-81cb286594cc"
              simplePath: "orders/processes/order-process.bpmn"
              canonicalPath: "3e98d77b-799b-4f31-bfc4-4c5829fc7dee/bccb5014-10a7-48df-bb56-81cb286594cc"
              revision: 3
              type: "bpmn"
              content: "<?xml version='1.0' encoding='UTF-8'?>..."
              created: "2025-03-15T10:30:00.000Z"
              createdBy:
                name: "Jane Doe"
                email: "jane.doe@example.com"
              updated: "2025-06-10T14:22:00.000Z"
              updatedBy:
                name: "Jane Doe"
                email: "jane.doe@example.com"
      required:
        - folder
        - content
      properties:
        folder:
          description: The folder metadata.
          allOf:
            - $ref: "#/components/schemas/FolderResult"
        content:
          description: The content of the folder (child folders and files).
          allOf:
            - $ref: "#/components/schemas/FolderContent"

    FolderContent:
      type: object
      description: The content of a folder, listing its direct children.
      required:
        - folders
        - files
      properties:
        folders:
          description: The child folders within this folder.
          type: array
          items:
            $ref: "#/components/schemas/FolderResult"
        files:
          description: The files within this folder.
          type: array
          items:
            $ref: "files.yaml#/components/schemas/FileResult"

    # --- Recently deleted schemas ---

    RecentlyDeletedFolderSearchQuery:
      type: object
      properties:
        page:
          description: >
            Pagination criteria. Supports offset-based pagination (from/limit) or
            a simple limit.
          allOf:
            - $ref: "search-models.yaml#/components/schemas/SearchQueryPage"
        sort:
          description: Sort field criteria.
          type: array
          items:
            $ref: "#/components/schemas/RecentlyDeletedFolderSearchQuerySortRequest"
        filter:
          description: The recently deleted folder search filters.
          allOf:
            - $ref: "#/components/schemas/RecentlyDeletedFolderFilter"

    RecentlyDeletedFolderFilter:
      type: object
      description: Filter criteria for searching recently deleted folders.
      properties:
        folderKey:
          description: Filter by the key of the deleted folder.
          x-semantic-type: FolderKey
          allOf:
            - $ref: "filters.yaml#/components/schemas/BasicStringFilterProperty"
        name:
          description: Filter by folder name.
          allOf:
            - $ref: "filters.yaml#/components/schemas/StringFilterProperty"
        projectKey:
          description: Filter by the key of the project the folder belonged to.
          x-semantic-type: ProjectKey
          allOf:
            - $ref: "filters.yaml#/components/schemas/BasicStringFilterProperty"
        deleted:
          description: Filter by deletion date.
          allOf:
            - $ref: "filters.yaml#/components/schemas/DateTimeFilterProperty"

    RecentlyDeletedFolderSearchQuerySortRequest:
      type: object
      required:
        - field
      properties:
        field:
          description: The field to sort by.
          type: string
          enum:
            - name
            - deleted
        order:
          $ref: "search-models.yaml#/components/schemas/SortOrderEnum"

    RecentlyDeletedFolderSearchQueryResult:
      type: object
      required:
        - items
        - page
      properties:
        items:
          description: The recently deleted folders.
          type: array
          items:
            $ref: "#/components/schemas/RecentlyDeletedFolderResult"
        page:
          description: Pagination metadata for the search results.
          allOf:
            - $ref: "search-models.yaml#/components/schemas/SearchQueryPageResponse"

    RecentlyDeletedFolderResult:
      type: object
      required:
        - folderKey
        - name
        - projectKey
        - deleted
        - deletedBy
      properties:
        folderKey:
          description: The unique key identifying the deleted folder.
          allOf:
            - $ref: "keys.yaml#/components/schemas/FolderKey"
        name:
          description: The name of the deleted folder.
          type: string
        projectKey:
          description: The key of the project the folder belonged to.
          allOf:
            - $ref: "keys.yaml#/components/schemas/ProjectKey"
        deleted:
          description: The timestamp when the folder was deleted.
          type: string
          format: date-time
        deletedBy:
          description: The user who deleted the folder.
          allOf:
            - $ref: "files.yaml#/components/schemas/UserReference"
          nullable: true
