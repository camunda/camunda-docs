<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 512"><!-- svg-source:excalidraw --><metadata></metadata><defs></defs><rect x="0" y="0" width="920" height="512" fill="#ffffff"></rect><g transform="translate(10 10) rotate(0 350 17)"><text x="0" y="27.20703125" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28px" fill="#1e40af" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Why three zones, and not two</text></g><g transform="translate(10 52) rotate(0 450 22)"><text x="0" y="16.746875" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16px" fill="#64748b" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">One partition, one replica per zone.</text><text x="0" y="39.146874999999994" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16px" fill="#64748b" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">A partition works while a majority of its replicas answer.</text></g><g transform="translate(10 142) rotate(0 210 12)"><text x="0" y="19.43359375" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20px" fill="#1e40af" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">2 zones, one lost</text></g><g stroke-linecap="round" transform="translate(10 178) rotate(0 66 52)"><path d="M26 0 C47.24 0, 68.47 0, 106 0 C123.33 0, 132 8.67, 132 26 C132 42.09, 132 58.18, 132 78 C132 95.33, 123.33 104, 106 104 C89.53 104, 73.06 104, 26 104 C8.67 104, 0 95.33, 0 78 C0 66.23, 0 54.46, 0 26 C0 8.67, 8.67 0, 26 0" stroke="none" stroke-width="0" fill="#a7f3d0"></path><path d="M26 0 C53.9 0, 81.79 0, 106 0 M26 0 C56.14 0, 86.28 0, 106 0 M106 0 C123.33 0, 132 8.67, 132 26 M106 0 C123.33 0, 132 8.67, 132 26 M132 26 C132 46.64, 132 67.28, 132 78 M132 26 C132 44.02, 132 62.03, 1